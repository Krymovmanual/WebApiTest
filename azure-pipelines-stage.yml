trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: windows-latest

variables:
  - group: WebApiTest-Stage

steps:
  - checkout: self

  - task: UseDotNet@2
    displayName: Use .NET 8 SDK
    inputs:
      packageType: sdk
      version: 8.x

  - script: dotnet restore WebApiTest.sln
    displayName: Restore

  - script: dotnet build WebApiTest.sln --configuration Release --no-restore
    displayName: Build

  - script: dotnet test WebApiTest.sln --configuration Release --no-build --logger trx
    displayName: Run tests
    env:
      WEBAPI_RUN_LIVE: '1'
      WEBAPI_BASE_URL: 'https://qu-stage-qfwebapi.azurewebsites.net/'
      STAGE_USERNAME: $(STAGE_USERNAME)
      STAGE_PASSWORD: $(STAGE_PASSWORD)
