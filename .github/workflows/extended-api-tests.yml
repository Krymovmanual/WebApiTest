name: Extended API tests

on:
  push:
    branches: [main, feature/extended-api-tests, 'feature/fireblocks-*']
    paths:
      - 'WebApiTest.Extended/**'
      - '.github/workflows/extended-api-tests.yml'
      - 'scripts/**'
  pull_request:
    branches: [main]
    paths:
      - 'WebApiTest.Extended/**'
      - '.github/workflows/extended-api-tests.yml'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WEBAPI_RUN_LIVE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore WebApiTest.Extended/WebApiTest.Extended.csproj
      - name: Build
        run: dotnet build WebApiTest.Extended/WebApiTest.Extended.csproj --configuration Release --no-restore
      - name: Verify test discovery and removed offline suite
        shell: pwsh
        run: |
          $offline = Get-ChildItem WebApiTest.Extended -Recurse -Filter *.cs | Select-String 'Trait\("Suite",\s*"Offline"\)'
          if ($offline) { throw "Offline test attributes remain" }
          dotnet test WebApiTest.Extended/WebApiTest.Extended.csproj --configuration Release --no-build --list-tests
          if ($LASTEXITCODE -ne 0) { throw "Test discovery failed" }
