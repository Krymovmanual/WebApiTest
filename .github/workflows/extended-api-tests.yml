name: Extended API tests

on:
  push:
    branches: [main, feature/extended-api-tests, 'feature/fireblocks-*']
    paths:
      - 'WebApiTest.Extended/**'
      - 'WebApiTest/**'
      - '.github/workflows/extended-api-tests.yml'
      - 'scripts/**'
  pull_request:
    branches: [main]
    paths:
      - 'WebApiTest.Extended/**'
      - '.github/workflows/extended-api-tests.yml'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WEBAPI_RUN_LIVE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore WebApiTest.sln
      - name: Build
        run: dotnet build WebApiTest.sln --configuration Release --no-restore
      - name: Verify direct method discovery
        shell: pwsh
        run: |
          $offline = Get-ChildItem WebApiTest.Extended -Recurse -Filter *.cs | Select-String 'Trait\("Suite",\s*"Offline"\)'
          if ($offline) { $offline | ForEach-Object { Write-Host $_ }; throw "Offline test attributes remain" }
          foreach ($environment in @("DEV", "STAGE")) {
            $env:WEBAPI_ENVIRONMENT = $environment
            $catalog = Get-Content ("WebApiTest.Extended/Contracts/requests.{0}.json" -f $environment.ToLowerInvariant()) -Raw | ConvertFrom-Json
            $expected = @($catalog.PSObject.Properties).Count
            $discovered = dotnet test WebApiTest.Extended/WebApiTest.Extended.csproj --configuration Release --no-build --list-tests --filter "Environment=$environment"
            if ($LASTEXITCODE -ne 0) { throw "Test discovery failed" }
            $discovered | ForEach-Object { Write-Host $_ }
            $actual = @($discovered | Where-Object { $_ -match '^\s+WebApiTest\.Extended\.Tests\.\w+\.\w+Methods\.' }).Count
            if ($actual -ne $expected) { throw "$environment expected $expected methods; discovered $actual" }
            dotnet test WebApiTest.Extended/WebApiTest.Extended.csproj --configuration Release --no-build --filter "Environment=$environment"
            if ($LASTEXITCODE -ne 0) { throw "$environment non-live test run failed" }
          }
